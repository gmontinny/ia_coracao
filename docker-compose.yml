services:
  # Serviço Principal: Aplicação Streamlit de Diagnóstico Cardiológico Multimodal
  ecg-ai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecg_ai_application
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - VECTOR_DB_HOST=qdrant-vectordb
      - VECTOR_DB_PORT=6333
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - .:/app
    depends_on:
      qdrant-vectordb:
        condition: service_started
    networks:
      - ecg_ai_network

  # Base Vetorial Especializada: Qdrant Vector Database para RAG de Diretrizes Clínicas (AHA/ACC/ESC/SBC)
  qdrant-vectordb:
    image: qdrant/qdrant:v1.9.0
    container_name: ecg_ai_qdrant_vectordb
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - ecg_ai_network

networks:
  ecg_ai_network:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local
